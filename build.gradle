plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

base {
	archivesName = 'villagerciv'
}

loom {
	splitEnvironmentSourceSets()

	runs {
		client {
			// A fixed name gives the dev player the same UUID on every launch. Without it each
			// launch is a new player, and expeditions from the last session wait for someone who
			// never comes back.
			programArgs "--username", "Dev"
		}
		// An unattended run for checking the mod: opens the world "AutoTest" in a game directory
		// of its own (so the developer's options and saves are left alone), fast-forwards it and
		// stops. See AutoTest.java; started by tools/autotest.sh.
		autotest {
			client()
			runDir "run-autotest"
			programArgs "--username", "Dev", "--quickPlaySingleplayer", "AutoTest"
			vmArg "-Dvillagerciv.autotest=${project.findProperty('autotestTicks') ?: '24000'}"
			vmArg "-Dvillagerciv.autotest.showcase=${project.findProperty('autotestShowcase') ?: 'false'}"
			vmArg "-Dvillagerciv.autotest.expand=${project.findProperty('autotestExpand') ?: 'false'}"
			vmArg "-Dvillagerciv.autotest.shortage=${project.findProperty('autotestShortage') ?: 'false'}"
			vmArg "-Dvillagerciv.autotest.roam=${project.findProperty('autotestRoam') ?: 'false'}"
		}
	}

	mods {
		"villagerciv" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// Simulation core is shipped inside the mod jar (jar-in-jar): one mod, one file.
	implementation project(':core')
	include project(':core')
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
	it.options.encoding = 'UTF-8'
}

java {
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}
